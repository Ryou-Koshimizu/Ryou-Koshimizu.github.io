<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ（テスト）</title>
<style>html,body{margin:0;padding:0;overflow-x:hidden}</style>
</head>
<body>
<style>
.lumen-canvas{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:start;box-sizing:border-box;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
.lumen-canvas{width:100vw;margin-left:calc(50% - 50vw);padding-left:max(20px,calc(50vw - 600px));padding-right:max(20px,calc(50vw - 600px))}
.lumen-canvas>*{margin:0;min-width:0}
.lumen-canvas img{max-width:100%;height:auto;display:block;border-radius:12px}
.lumen-canvas ul,.lumen-canvas ol{padding-left:1.4em;margin:0}
.lumen-canvas .lb-cta{display:inline-block;padding:14px 28px;border-radius:12px;background:#1a4fd6;color:#fff;text-decoration:none;font-weight:700}
.lumen-canvas .lb-cta.ghost{background:transparent;color:#1a4fd6;box-shadow:inset 0 0 0 2px #1a4fd6}
.lumen-canvas .bg-tint{background:#f3f5fb;border-radius:12px}
.lumen-canvas .bg-accent{background:#1a4fd6;color:#fff;border-radius:12px}
.lumen-canvas .bg-accent a{color:#fff}
.lumen-canvas .bg-dark{background:#101828;color:#fff;border-radius:12px}
.lumen-canvas .bg-dark a{color:#fff}
.lumen-canvas .sz-sm{font-size:.875rem}
.lumen-canvas .sz-md{font-size:1rem}
.lumen-canvas .sz-lg{font-size:1.375rem}
.lumen-canvas .sz-xl{font-size:clamp(1.75rem,4.5vw,2.75rem);line-height:1.25}
@keyframes lz-rise{from{transform:translateY(14px)}to{transform:none}}
@keyframes lz-fromleft{from{transform:translateX(-18px)}to{transform:none}}
@keyframes lz-fromright{from{transform:translateX(18px)}to{transform:none}}
@keyframes lz-zoom{from{transform:scale(.96)}to{transform:none}}
.lumen-canvas .lz-form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.lumen-canvas .lz-form-intro{margin:0}
.lumen-canvas .lz-field{display:flex;flex-direction:column;gap:6px}
.lumen-canvas .lz-flabel{font-weight:600;font-size:.9em}
.lumen-canvas .lz-field input,.lumen-canvas .lz-field textarea,.lumen-canvas .lz-field select{font:inherit;padding:10px 12px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;color:#101828;width:100%;box-sizing:border-box}
.lumen-canvas .lz-field textarea{resize:vertical;min-height:96px}
.lumen-canvas .lz-fsubmit{align-self:start;padding:12px 28px;border:0;border-radius:12px;background:#1a4fd6;color:#fff;font-weight:700;cursor:pointer;font:inherit}
.lb-f0000001{grid-column:1 / span 12;grid-row:1}
@media (max-width: 767px){
.lumen-canvas{gap:12px}
.lumen-canvas>*{grid-column: 1 / -1;grid-row:auto}

}
</style>
<div class="lumen-canvas">
<form class="lb-f0000001 lz-form" data-lz-form novalidate data-lz-endpoint="https://analytics.lumen-ai-web.com/api/inquiry/LUMEN-4Q7T-AY4V-DXUQ-UZVU-D3JB-8D6U" data-lz-page="/lumen-form-test"><p class="lz-form-intro">テスト送信フォーム（動作確認用・後で削除します）</p><label class="lz-field"><span class="lz-flabel">お名前</span><input type="text" name="11111111" required></label><label class="lz-field"><span class="lz-flabel">メール</span><input type="email" name="22222222" required></label><label class="lz-field"><span class="lz-flabel">ご相談内容</span><textarea name="33333333" required rows="4"></textarea></label><button type="submit" class="lz-fsubmit">送信する</button></form>
</div>
<script data-lz="lz-form-submit">
(function(){
  var forms = document.querySelectorAll('form[data-lz-form][data-lz-endpoint]');
  for (var i = 0; i < forms.length; i++) (function (f) {
    var note = document.createElement('p');
    note.className = 'lz-form-note';
    note.setAttribute('role', 'status');
    note.setAttribute('aria-live', 'polite');
    f.appendChild(note);
    function say(msg) { note.textContent = msg; }
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var btn = f.querySelector('button[type=submit]');
      if (btn && btn.disabled) return;
      var answers = {};
      var els = f.querySelectorAll('[name]');
      for (var j = 0; j < els.length; j++) answers[els[j].name] = els[j].value;
      if (btn) { btn.disabled = true; btn.style.opacity = '.5'; btn.style.cursor = 'not-allowed'; }
      say('送信しています…');
      fetch(f.getAttribute('data-lz-endpoint'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          form_page: f.getAttribute('data-lz-page'),
          answers: answers,
          page: location.href,
          referrer: document.referrer || ''
        })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          return { ok: r.ok, d: d };
        });
      }).then(function (res) {
        if (res.ok) { f.reset(); say('送信しました。ありがとうございます。'); }
        else { say((res.d && res.d.error) || '送信できませんでした。時間をおいてお試しください。'); }
      }).catch(function () {
        say('送信できませんでした。通信環境をご確認ください。');
      }).then(function () {
        if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
      });
    });
  })(forms[i]);
})();
</script></body>
</html>
