<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜LUMEN</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/Lumen/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/Lumen/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/Lumen/img/apple-touch-icon.png">
  <meta name="theme-color" content="#07080B">
  <link rel="stylesheet" href="/Lumen/css/style.css">
  <style>
    /* 404専用の最小レイアウト（JS不要・自己完結） */
    .nf { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; gap: 8px; }
    .nf__code { font-size: clamp(4rem, 16vw, 9rem); font-weight: 800; line-height: 1; letter-spacing: -0.04em; background: linear-gradient(90deg, var(--accent), #BCD4FF, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nf__title { font-size: clamp(1.2rem, 4vw, 1.6rem); font-weight: 700; margin-top: 8px; }
    .nf__desc { color: var(--muted); font-size: .92rem; max-width: 32em; margin: 12px auto 0; line-height: 1.9; }
    .nf__actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 32px; }
    .nf__logo { position: absolute; top: 24px; left: 24px; }
    .nf__logo img { height: 28px; width: auto; filter: brightness(0) invert(1); }
  </style>
</head>
<body>
  <a class="nf__logo" href="/Lumen/index.html" aria-label="LUMEN トップへ"><img src="/Lumen/img/logo.webp" alt="LUMEN" width="160" height="40"></a>
  <main class="nf" id="main">
    <p class="nf__code">404</p>
    <h1 class="nf__title">ページが見つかりませんでした</h1>
    <p class="nf__desc">お探しのページは移動・削除されたか、URLが間違っている可能性があります。お手数ですが、トップページからお探しください。</p>
    <div class="nf__actions">
      <a class="btn btn-primary" href="/Lumen/index.html">トップへ戻る</a>
      <a class="btn btn-ghost" href="/Lumen/contact.html">無料相談はこちら</a>
    </div>
  </main>
</body>
</html>
